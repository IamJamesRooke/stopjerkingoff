name: Build PDF and EPUB
# The PDF and EPUB are slow to build, so they are rebuilt nightly or on demand instead of on every push.
# Each run stores them on the "formats" release, then redeploys the site so the download links pick them up.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: formats
  cancel-in-progress: true
jobs:
  formats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-tinytex@v2
      - name: Install R packages
        run: Rscript -e 'install.packages(c("bookdown", "rmarkdown"))'
      - name: Build EPUB and PDF
        run: |
          Rscript -e "bookdown::render_book('index.Rmd', 'bookdown::epub_book')"
          Rscript -e "bookdown::render_book('index.Rmd', 'bookdown::pdf_book')" || echo "PDF build failed; keeping the previous PDF"
      - name: Store them on the formats release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view formats >/dev/null 2>&1 || gh release create formats --latest=false \
            --title "PDF and EPUB (latest build)" --notes "Rebuilt by the Build PDF and EPUB workflow. The website serves these files."
          files=$(ls _book/stopjerkingoff.epub _book/stopjerkingoff.pdf 2>/dev/null)
          gh release upload formats $files --clobber
      - name: Redeploy the site with the new files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
