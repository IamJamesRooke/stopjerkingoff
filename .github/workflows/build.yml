name: Build and publish book
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    # A newer push cancels an older build that is still queued or running.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
      - name: Install R packages
        run: Rscript -e 'install.packages(c("bookdown", "rmarkdown"))'
      - name: Build
        run: bash build.sh
        env:
          BUILD_FORMATS: "0"
      # The PDF and EPUB come from the latest "Build PDF and EPUB" run (nightly or on demand).
      - name: Add the latest PDF and EPUB
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download formats --repo "$GITHUB_REPOSITORY" -p 'stopjerkingoff.*' -D _book --clobber
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _book
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Never cut a deployment off halfway; a newer one waits its turn.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Tell Bing, Yandex and other IndexNow search engines that the pages changed.
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          sleep 20
          urls=$(curl -fsS https://stopjerkingoff.com/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -sc .)
          curl -sS -o /dev/null -w "IndexNow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"stopjerkingoff.com\",\"key\":\"995610663d437ca10b5831596d87abb4\",\"keyLocation\":\"https://stopjerkingoff.com/995610663d437ca10b5831596d87abb4.txt\",\"urlList\":$urls}"
