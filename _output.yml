bookdown::gitbook:
  css: style.css
  config:
    toc:
      before: |
        <li><a href="./">The Easy Peasy Way to Stop Jerking Off</a></li>
      after: |
        <li><a href="https://github.com/IamJamesRooke/stopjerkingoff">Source repository</a></li>
        <li><a href="https://github.com/rstudio/bookdown" target="blank">Published with bookdown</a></li>
    download: ["pdf", "epub"]
bookdown::pdf_book:
  includes:
    in_header: preamble.tex
  latex_engine: xelatex
  keep_tex: no
bookdown::epub_book: default
