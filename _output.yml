bookdown::gitbook:
  css: style.css
  pandoc_args: ["--strip-comments"]
  config:
    toc:
      before: |
        <li class="site-logo"><a href="./"><img src="images/logo.svg" alt="" width="28" height="28"> Stop Jerking Off</a></li>
        <li class="visit-count" id="sjo-count" hidden></li>
        <li><a href="stopjerkingoff.pdf"><i class="fa fa-file-pdf-o"></i> Download the PDF</a></li>
        <li><a href="stopjerkingoff.epub"><i class="fa fa-book"></i> Download the EPUB (e-readers)</a></li>
        <li><a href="faq.html"><i class="fa fa-question-circle"></i> Common questions (FAQ)</a></li>
        <li><a href="about.html"><i class="fa fa-info-circle"></i> Book summary and contact</a></li>
        <li class="divider"></li>
      after: |
        <li><a href="about.html#privacy">Privacy</a></li>
        <li><a href="https://github.com/rstudio/bookdown" target="blank">Published with bookdown</a></li>
    download: ["pdf", "epub"]
bookdown::pdf_book:
  includes:
    in_header: preamble.tex
  latex_engine: xelatex
  toc_depth: 1
  keep_tex: no
  pandoc_args: ["--lua-filter=tools/dropcap.lua", "--strip-comments", "-V", "fontsize=11pt", "-V", "indent=true", "-V", "classoption=openany"]
bookdown::epub_book:
  cover_image: images/cover.png
  metadata: epub-metadata.xml
  stylesheet: epub.css
  toc: false
  toc_depth: 1
  pandoc_args: ["--lua-filter=tools/epub.lua", "--strip-comments", "--epub-title-page=false"]
