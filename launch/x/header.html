<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&display=block" rel="stylesheet">
<style>html,body{margin:0}
body{width:1500px;height:500px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 30% 40%,#1a2742 0%,#111a2c 55%,#0b111e 100%);color:#efe6d2}
.t{position:absolute;left:90px;top:70px;width:720px}
.a{font:italic 600 46px/1.1 "Cormorant Garamond",serif;color:#e6d9b8}
.b{font:900 92px/1 "Playfair Display",serif;margin:14px 0 20px}
.rule{display:flex;align-items:center;gap:12px;width:260px}.rule i{flex:1;height:2px;background:#c9a55a}.rule b{width:9px;height:9px;background:#c9a55a;transform:rotate(45deg)}
.c{font:700 26px "Cormorant Garamond",serif;letter-spacing:.3em;color:#c9a55a;text-transform:uppercase;margin-top:20px}
.img{position:absolute;right:50px;top:40px;height:420px;border-radius:26px;box-shadow:0 0 0 4px #c9a55a}
</style></head><body>
<div class="t"><div class="a">The craving feels like a dragon.</div><div class="b">It's a pipsqueak.</div><div class="rule"><i></i><b></b><i></i></div><div class="c">Starve him</div></div>
<img class="img" src="dragon.png"></body></html>
